
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome To Chomik.</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
                'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #000000, #040404);
            color: white;
            text-align: center;
        }

        .content {
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: normal;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 1rem;
        }

        .button {
            padding: 12px 24px;
            min-width: 140px;
            border-radius: 5px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
        }

        .outlined-button {
            background: white;
            color: black;
            border: 0px solid rgb(0, 0, 0);
        }

        .solid-button {
            background: white;
            color: black;
            border: 0 solid white;
        }

        .or {
            color: white;
        }
    </style>
</head>

<body>

    <div class="hero">
        <div class="content">

            <h1>Welcome To Chomik.</h1>
            <div class="buttons">
                <button class="button outlined-button"
                    id="startBrowsing">
                    Start Browsing
                </button>

                <span class="or">or...</span>

                <button class="button solid-button"
                    id="openDocumentation">
                    Open Documentation
                </button>
            </div>

        </div>
    </div>

    <script>
        const documentationURL = "https://github.com/minbrowser/min/wiki";

        document.getElementById("openDocumentation")
            .addEventListener("click", () => {
                window.location.href = documentationURL;
            });

        document.getElementById("startBrowsing")
            .addEventListener("click", () => {
                window.close();
            });
    </script>

</body>
</html>
